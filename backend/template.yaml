AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SideKick /ask endpoint — a Lambda behind an API Gateway HTTP API that grounds
  Amazon Bedrock (Nova) with viewing context and returns 10-foot-friendly
  answers. (Public Lambda Function URLs are blocked on our account, so the
  live deployment uses an HTTP API; this template mirrors that.)

Parameters:
  BedrockModelId:
    Type: String
    # Must be multimodal (Lite/Pro): the model reads real video frames.
    Default: us.amazon.nova-lite-v1:0
    Description: Bedrock model / inference profile id used by Converse.
  MediaBucket:
    Type: String
    Default: sidekickvegaos
    Description: Bucket holding frames/<videoId>/<second>.jpg (scripts/extract-frames.sh).

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x

Resources:
  AskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Cost guard: the endpoint is public, so cap request rate per route.
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['POST', 'OPTIONS']
        AllowHeaders: ['content-type']

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: dist/
      # Hard ceiling on concurrent Bedrock calls even if throttling is bypassed.
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MEDIA_BUCKET: !Ref MediaBucket
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref AskApi
            Path: /ask
            Method: POST
      Policies:
        # Least-privilege: only Converse on the Nova model family.
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:*:inference-profile/*nova*'
            # Read-only access to the extracted frames, nothing else in the bucket.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:aws:s3:::${MediaBucket}/frames/*'

Outputs:
  AskEndpoint:
    Description: Set as ASK_ENDPOINT in src/config.ts.
    Value: !Sub 'https://${AskApi}.execute-api.${AWS::Region}.amazonaws.com/ask'
